    command:
    - /bin/sh
    - -c
    - |
      # Resolve a working Hugging Face endpoint at container startup.
      # Prefer whatever HF_ENDPOINT the deployment sets, but transparently
      # fall back to https://huggingface.co when the preferred endpoint
      # is unhealthy. The probe is intentionally strict so it catches
      # "fake mirrors" like hf-mirror.com which is now just a Caddy 308
      # redirector that strips HF response headers (causing
      # huggingface_hub to throw FileMetadataError mid-download).
      HF_OFFICIAL="https://huggingface.co"
      HF_PREFERRED="${HF_ENDPOINT:-$HF_OFFICIAL}"

      # Extract --model from the workload args so the probe hits the
      # actual repo-resolve path the library will use, not a generic
      # /api/models/gpt2 lookup that can succeed via redirect even
      # when the endpoint is broken for the model we need.
      HF_PROBE_MODEL=""
      _set_probe_model() {
        while [ "$#" -gt 0 ]; do
          case "$1" in
            --model=*) HF_PROBE_MODEL="${1#--model=}"; return ;;
            --model)   shift; HF_PROBE_MODEL="$1"; return ;;
          esac
          shift
        done
      }
      _set_probe_model "$@"
      export HF_PROBE_MODEL
      export HF_PROBE_TOKEN="${HUGGING_FACE_HUB_TOKEN:-${HF_TOKEN:-}}"

      _hf_probe() {
        HF_PROBE_ENDPOINT="$1" python3 -c '
      import os, ssl, sys
      from urllib.request import (
          Request, build_opener, HTTPRedirectHandler, HTTPSHandler,
      )

      class _NoRedirect(HTTPRedirectHandler):
          def redirect_request(self, req, fp, code, msg, headers, newurl):
              return None

      endpoint = os.environ["HF_PROBE_ENDPOINT"].rstrip("/")
      model = os.environ.get("HF_PROBE_MODEL", "") or "gpt2"
      token = os.environ.get("HF_PROBE_TOKEN", "")
      url = endpoint + "/" + model + "/resolve/main/config.json"
      req_headers = {"User-Agent": "hf-endpoint-probe/2.0"}
      if token:
          req_headers["Authorization"] = "Bearer " + token

      opener = build_opener(_NoRedirect, HTTPSHandler(context=ssl.create_default_context()))
      try:
          resp = opener.open(
              Request(url, method="HEAD", headers=req_headers),
              timeout=10,
          )
          code = getattr(resp, "status", resp.getcode())
          raw = resp.headers
      except Exception as exc:
          code = getattr(exc, "code", None)
          raw = getattr(exc, "headers", None)
          if code is None or raw is None:
              print("hf-endpoint probe failed for " + endpoint + ": " + str(exc), file=sys.stderr)
              sys.exit(1)

      headers = {k.lower(): v for k, v in raw.items()} if raw else {}
      # x-powered-by:huggingface-moon and x-request-id are present on
      # every HF response (200/307/401/...). A "fake mirror" like
      # hf-mirror.com responds with only `server: Caddy` and bare
      # Location, so the absence of these markers reliably identifies
      # a redirector/proxy that will trip up huggingface_hub.
      is_hf = bool(
          "huggingface" in headers.get("x-powered-by", "").lower()
          or headers.get("x-request-id")
          or headers.get("x-repo-commit")
          or headers.get("x-linked-etag")
          or headers.get("x-error-code")
      )
      if not is_hf:
          print("hf-endpoint " + endpoint + " is not a real HF endpoint (status=" + str(code) + ", no HF headers)", file=sys.stderr)
          sys.exit(1)
      if code is not None and code >= 500:
          print("hf-endpoint " + endpoint + " unhealthy (5xx, status=" + str(code) + ")", file=sys.stderr)
          sys.exit(1)
      # Real HF response (2xx/3xx/4xx). 4xx like 401/403/404 is an
      # auth/repo issue, not an endpoint issue -- another HF endpoint
      # would give the same answer, so we use this one and let the
      # workload surface the real error.
      sys.exit(0)
      '
      }

      if _hf_probe "$HF_PREFERRED"; then
        export HF_ENDPOINT="$HF_PREFERRED"
      elif [ "$HF_PREFERRED" != "$HF_OFFICIAL" ] && _hf_probe "$HF_OFFICIAL"; then
        echo "[hf-endpoint] preferred '$HF_PREFERRED' unhealthy for model '${HF_PROBE_MODEL:-<unknown>}', falling back to '$HF_OFFICIAL'" >&2
        export HF_ENDPOINT="$HF_OFFICIAL"
      else
        echo "[hf-endpoint] WARNING: no HF endpoint healthy for model '${HF_PROBE_MODEL:-<unknown>}', continuing with '$HF_PREFERRED'" >&2
        export HF_ENDPOINT="$HF_PREFERRED"
      fi

      echo "[hf-endpoint] using HF_ENDPOINT=$HF_ENDPOINT (probed for ${HF_PROBE_MODEL:-generic})" >&2
      unset HF_PROBE_ENDPOINT HF_PROBE_MODEL HF_PROBE_TOKEN

      # Auto-resolve a safe --gpu-memory-utilization based on actually
      # free GPU memory at startup. Prevents OOM at engine init when
      # the device is shared (KAI fractional allocation, leaked CUDA
      # contexts from prior pods, other tenants) and a static high
      # value like 0.95 would exceed what is actually free. Respects
      # an explicit --gpu-memory-utilization in $@ (user override).
      GPU_AUTO_UTIL_ARG=""
      _has_gpu_util_arg() {
        for _arg in "$@"; do
          case "$_arg" in
            --gpu-memory-utilization|--gpu-memory-utilization=*) return 0 ;;
          esac
        done
        return 1
      }
      if _has_gpu_util_arg "$@"; then
        echo "[gpu-util] respecting explicit --gpu-memory-utilization from args" >&2
      else
        _gpu_util_value="$(python3 -c '
      import sys
      try:
          import pynvml
          pynvml.nvmlInit()
          margin = 4 * 1024 * 1024 * 1024  # 4 GiB headroom for CUDA graphs / fragmentation / other tenants
          ratios = []
          for i in range(pynvml.nvmlDeviceGetCount()):
              h = pynvml.nvmlDeviceGetHandleByIndex(i)
              info = pynvml.nvmlDeviceGetMemoryInfo(h)
              safe = max(0, info.free - margin)
              ratios.append(safe / info.total)
          if not ratios:
              raise RuntimeError("no GPUs visible")
          print("{:.2f}".format(max(0.50, min(0.92, min(ratios)))))
      except Exception as exc:
          print("[gpu-util] cannot query GPU memory (" + str(exc) + "), using conservative 0.80", file=sys.stderr)
          print("0.80")
      ')"
        GPU_AUTO_UTIL_ARG="--gpu-memory-utilization=${_gpu_util_value}"
        echo "[gpu-util] auto-resolved ${GPU_AUTO_UTIL_ARG}" >&2
      fi

      # Unquoted on purpose: empty -> no arg; non-empty -> exactly one
      # word with no spaces, so word-splitting is safe here.
      exec python3 -m vllm.entrypoints.openai.api_server "$@" ${GPU_AUTO_UTIL_ARG}
