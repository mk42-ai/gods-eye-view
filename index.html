<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{PRODUCT_NAME}} · Scene Workstation</title>
  <meta name="description" content="{{PRODUCT_NAME}} — {{PRODUCT_DESCRIPTION}}" />
  <meta name="build-id" content="%VITE_BUILD_REFERENCE%" />
  <meta name="theme-color" content="#1b1b1d" />
  <link rel="icon" href="/assets/brand/favicon.ico" sizes="any" />
</head>
<body class="ws-body">
  <div id="ws-app" class="ws-app" data-mode="render" data-state="idle">
    <header class="ws-topbar">
      <div class="ws-brand">Scene Workstation</div>
      <form id="ws-prompt-form" class="ws-prompt" autocomplete="off">
        <label class="ws-sr" for="ws-prompt">Scene prompt</label>
        <input id="ws-prompt" name="prompt" type="text" maxlength="600"
               placeholder="Describe a scene, e.g. car crash outside yas mall" />
        <button id="ws-build" class="ws-btn ws-btn-accent" type="submit">Build</button>
      </form>
      <div class="ws-modes" role="radiogroup" aria-label="Viewport shading">
        <button type="button" class="ws-mode" data-mode="render" role="radio" aria-checked="true">Render</button>
        <button type="button" class="ws-mode" data-mode="solid" role="radio" aria-checked="false">Solid</button>
        <button type="button" class="ws-mode" data-mode="wire" role="radio" aria-checked="false">Wireframe</button>
      </div>
      <div class="ws-drawer-toggles">
        <button type="button" class="ws-btn" data-drawer="outliner" aria-controls="ws-outliner">Outliner</button>
        <button type="button" class="ws-btn" data-drawer="properties" aria-controls="ws-properties">Properties</button>
      </div>
    </header>

    <aside id="ws-outliner" class="ws-panel ws-outliner" aria-label="Outliner">
      <h2 class="ws-panel-title">Outliner</h2>
      <ul id="ws-outliner-list" class="ws-tree"><li class="ws-empty">No scene yet. Type a prompt and press Build.</li></ul>
    </aside>

    <main id="ws-viewport" class="ws-viewport" aria-label="Render viewport" data-has-frame="0">
      <div id="ws-frame-slot" class="ws-frame-slot"></div>
      <canvas id="ws-frame-canvas" class="ws-frame-canvas" hidden></canvas>
      <div id="ws-progress" class="ws-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
        <div class="ws-progress-track"><div id="ws-progress-bar" class="ws-progress-bar"></div></div>
        <div id="ws-progress-text" class="ws-progress-text">Building…</div>
      </div>
      <div id="ws-banner" class="ws-banner" role="alert" hidden>
        <span id="ws-banner-text" class="ws-banner-text"></span>
        <button id="ws-retry" class="ws-btn" type="button">Retry</button>
      </div>
      <div id="ws-status" class="ws-status" role="status" aria-live="polite">Ready — Blender Cycles renderer</div>
      <div id="ws-hud" class="ws-hud" hidden></div>
    </main>

    <aside id="ws-properties" class="ws-panel ws-properties" aria-label="Properties">
      <h2 class="ws-panel-title">Properties</h2>
      <dl id="ws-props" class="ws-props"><dt>Renderer</dt><dd>Blender Cycles · OptiX</dd></dl>
    </aside>

    <footer class="ws-timeline" aria-label="Timeline">
      <div class="ws-transport">
        <button type="button" class="ws-btn" data-transport="first" aria-label="First frame">|&lt;</button>
        <button type="button" class="ws-btn" data-transport="prev" aria-label="Previous frame">&lt;</button>
        <button type="button" class="ws-btn ws-btn-accent" data-transport="play" aria-label="Play">Play</button>
        <button type="button" class="ws-btn" data-transport="next" aria-label="Next frame">&gt;</button>
        <button type="button" class="ws-btn" data-transport="last" aria-label="Last frame">&gt;|</button>
      </div>
      <input id="ws-scrub" class="ws-scrub" type="range" min="1" max="1" value="1" aria-label="Frame" disabled />
      <div id="ws-frame-readout" class="ws-readout">0 / 0</div>
    </footer>
  </div>
  <script type="module" src="/src/workstation/main.js"></script>
</body>
</html>
